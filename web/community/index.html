<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' file:; style-src 'self' file:; img-src 'self' file:; font-src 'self' file:; base-uri 'none'; form-action 'none'">
  <title>Skate community</title>
  <link rel="stylesheet" href="community.css">
  <script src="community/community.js" defer></script>
</head>
<body data-screen="startup">
  <header class="masthead">
    <div class="masthead-inner">
      <button type="button" class="access-back" id="access-back" hidden aria-label="Back to welcome">
        <img src="art/ink-back.png" width="22" height="22" alt="">
      </button>
      <div class="community-bar" id="community-bar" hidden>
        <div class="community-title"><p id="profile-name" class="profile-name"></p><h1 id="community-title" tabindex="-1">Discover</h1></div>
        <button type="button" class="compose" data-tab="lines" data-page="post"><img src="art/ink-add.png" alt=""><span>Post</span></button>
        <button type="button" class="profile-shortcut" data-tab="profile" aria-label="Open your profile"><img src="art/ink-avatar.png" alt=""></button>
      </div>
    </div>
  </header>

  <main class="page">
    <p id="startup" role="status">Opening your community…</p>
    <button type="button" id="retry" hidden>Try again</button>
    <p id="notice" class="feedback" role="status" hidden></p>

    <section class="welcome" id="welcome" hidden aria-labelledby="welcome-title">
      <div class="welcome-scene" aria-hidden="true">
        <img src="art/welcome-ground.jpg" width="860" height="1828" alt="">
      </div>
      <div class="welcome-content">
        <h1 id="welcome-title" tabindex="-1">See you<br>at the spot.</h1>
        <p>For the clips you replay and the friends you skate with.</p>
        <div class="welcome-actions">
          <button type="button" class="primary" data-access="register">Create profile</button>
          <button type="button" class="welcome-sign-in" data-access="signin">Sign in</button>
        </div>
      </div>
    </section>

    <section class="access" id="access" hidden aria-labelledby="auth-title">
      <figure class="welcome-image">
        <img src="art/welcome-ground.jpg" alt="" width="860" height="1828">
      </figure>
      <div class="auth-panel">
        <h1 id="auth-title" tabindex="-1">Welcome back</h1>
        <form id="auth-form" novalidate>
          <fieldset id="auth-fields">
            <label class="field" for="email">
              <span>Email address</span>
              <input id="email" type="email" inputmode="email" enterkeyhint="next" autocomplete="username" autocapitalize="none" spellcheck="false" maxlength="254" required>
            </label>
            <label class="field" for="password">
              <span>Password</span>
              <input id="password" type="password" enterkeyhint="go" autocomplete="current-password" maxlength="256" required>
            </label>
            <div class="agreement">
              <label class="consent-control" for="consent">
                <input id="consent" type="checkbox" aria-labelledby="consent-label" required>
              </label>
              <p id="consent-label">I agree to the <button type="button" class="text-action" data-policy="terms">Terms</button>
                and <button type="button" class="text-action" data-policy="privacy">Privacy Policy</button>.</p>
            </div>
          </fieldset>
          <p id="auth-error" class="feedback error" role="alert" hidden></p>
          <button type="submit" class="primary" id="auth-submit">Sign in</button>
        </form>
        <div class="account-options">
          <button type="button" class="text-action" id="auth-mode">New here? Create a profile</button>
        </div>
      </div>
    </section>

    <section id="community" hidden aria-labelledby="community-title">
      <button type="button" class="session-banner" data-tab="sessions" aria-label="Open your sessions">
        <img src="art/crew-session.jpg" width="1817" height="866" alt="">
        <span class="session-banner-copy"><strong>Make it a<br>skate day.</strong><span>Open your sessions</span></span>
      </button>
      <div class="collection-tools"><h2>Find your next line</h2><button type="button" class="gallery-link" data-tab="lines" data-page="collection">View gallery</button></div>
      <label class="collection-search" for="collection-search"><span>Search the collection</span><input id="collection-search" type="search" placeholder="Search photos and clips" enterkeyhint="search" autocomplete="off" maxlength="100"></label>
      <div class="filters" id="filters" role="group" aria-label="Filter lines">
        <button type="button" data-filter="all" aria-pressed="true">For you</button>
        <button type="button" data-filter="street" aria-pressed="false">Street</button>
        <button type="button" data-filter="park" aria-pressed="false">Park</button>
        <button type="button" data-filter="flat" aria-pressed="false">Flatground</button>
        <button type="button" data-filter="offboard" aria-pressed="false">Off the board</button>
        <button type="button" data-filter="saved" aria-pressed="false">Saved</button>
      </div>
      <div id="empty-state" class="feed-state" hidden>
        <p id="empty" role="status" tabindex="-1"></p>
        <button type="button" id="clear-filter" class="text-action">Show all lines</button>
      </div>
      <div id="feed" class="feed"></div>
      <button type="button" id="more" class="more" hidden>Show more lines</button>
      <footer class="community-footer"><button type="button" class="text-action" data-policy="rules">Crew rules</button></footer>
    </section>
  </main>

  <template id="line-template">
    <article class="line">
      <div class="line-caption">
        <div><p class="line-meta" data-item="collection"></p><h3 data-item="title"></h3></div>
        <button type="button" class="report-line" data-action="report"><img src="art/ink-flag.png" alt=""></button>
      </div>
      <button type="button" class="line-preview" data-action="open">
        <span class="line-image" hidden><img loading="lazy" decoding="async" alt=""></span>
        <span data-item="image-error" class="media-error" hidden>Preview unavailable</span>
        <span class="preview-label"><img src="art/ink-play.png" alt="" data-item="play" hidden><span data-item="open-label">View line</span></span>
      </button>
      <div class="line-actions">
        <button type="button" data-action="like" aria-pressed="false"><img src="art/ink-like.png" alt=""><span>Like</span></button>
        <button type="button" data-action="discussion" aria-expanded="false"><img src="art/ink-comment.png" alt=""><span>Comment</span></button>
        <button type="button" data-action="save" aria-pressed="false"><img src="art/ink-save.png" alt=""><span>Save</span></button>
      </div>
      <p data-item="feedback" class="feedback error" role="alert" hidden></p>
      <details class="discussion">
        <summary class="sr-only" tabindex="-1">Comments</summary>
        <ul data-item="comments"></ul>
        <form class="comment-form" novalidate>
          <label class="comment-label"><span>Add a comment</span><textarea rows="2" required maxlength="400"></textarea></label>
          <p data-item="comment-feedback" class="feedback error" role="alert" hidden></p>
          <button type="submit" class="primary">Add comment</button>
        </form>
      </details>
    </article>
  </template>
</body>
</html>
