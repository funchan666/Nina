name: Nina
options:
  minimumXcodeGenVersion: 2.44.1
  deploymentTarget:
    iOS: "17.6"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
targets:
  Nina:
    type: application
    platform: iOS
    deploymentTarget: "17.6"
    sources:
      - path: Nina/Platform
      - path: Nina/Resources
        excludes:
          - "*.storekit"
          - Info.plist
          - LinesCatalog.json
      - path: Nina/Resources/Products.storekit
        buildPhase: none
      - path: Nina/Resources/Info.plist
        buildPhase: none
    configFiles:
      Debug: Nina/Config/Debug.xcconfig
      Release: Nina/Config/Release.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.funchan666.nina
        PRODUCT_NAME: Nina
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        INFOPLIST_FILE: Nina/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: Nina/Config/Nina.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_STYLE: Automatic
        ENABLE_USER_SCRIPT_SANDBOXING: NO
      configs:
        Debug:
          NINA_PURCHASES_ENABLED: "YES"
        Release:
          NINA_PURCHASES_ENABLED: "NO"
    postBuildScripts:
      - name: Bundle React Native code and images
        basedOnDependencyAnalysis: false
        script: |
          set -e
          export PROJECT_ROOT="$PROJECT_DIR"
          RN_SCRIPTS="$PROJECT_DIR/node_modules/react-native/scripts"
          /bin/bash "$RN_SCRIPTS/xcode/with-environment.sh" "$RN_SCRIPTS/react-native-xcode.sh"
    entitlements:
      path: Nina/Config/Nina.entitlements
      properties:
        com.apple.developer.applesignin:
          - Default
schemes:
  Nina:
    build:
      targets:
        Nina: all
    run:
      config: Debug
      storeKitConfiguration: Nina/Resources/Products.storekit
    archive:
      config: Release
