name: Nina
options:
  minimumXcodeGenVersion: 2.44.1
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
targets:
  Nina:
    type: application
    platform: iOS
    deploymentTarget: "15.0"
    sources:
      - path: Nina/Sources
      - path: Nina/Resources
        excludes:
          - "*.storekit"
          - Info.plist
      - path: Nina/Resources/Products.storekit
        buildPhase: none
      - path: Nina/Resources/Info.plist
        buildPhase: none
    configFiles:
      Debug: Nina/Config/Nina.xcconfig
      Release: Nina/Config/Nina.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.funchan666.nina
        PRODUCT_NAME: Nina
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        INFOPLIST_FILE: Nina/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: Nina/Config/Nina.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_STYLE: Automatic
      configs:
        Debug:
          NINA_PURCHASES_ENABLED: "YES"
        Release:
          NINA_PURCHASES_ENABLED: "NO"
    entitlements:
      path: Nina/Config/Nina.entitlements
      properties:
        com.apple.developer.applesignin:
          - Default
schemes:
  Nina:
    build:
      targets:
        Nina: all
    run:
      config: Debug
      storeKitConfiguration: Nina/Resources/Products.storekit
    archive:
      config: Release
